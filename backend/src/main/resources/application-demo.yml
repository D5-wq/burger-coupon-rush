# 인프라(MySQL/Redis) 없이 바로 실행해보기 위한 demo 프로필.
#   SPRING_PROFILES_ACTIVE=demo ./gradlew bootRun
# H2 인메모리 DB를 사용하고 Redis/Redisson 자동설정은 제외한다.
# (Redis 기반 쿠폰 발급(Step 5)은 이 프로필에서 동작하지 않는다 — 그때는 local 프로필 사용)
spring:
  datasource:
    url: jdbc:h2:mem:burger;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  h2:
    console:
      enabled: true
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
